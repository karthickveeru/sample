name: ServiceNow POC Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build Step
        run: echo "Building application..."

      - name: Register Artifact in ServiceNow
        uses: ServiceNow/servicenow-devops-register-artifact@v3.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_TOKEN }}
          instance-url: ${{ vars.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: build
          artifacts: |
            [
              {
                "name": "cadence-app",
                "version": "1.0.${{ github.run_number }}",
                "semanticVersion": "1.0.${{ github.run_number }}",
                "repositoryName": "${{ github.repository }}"
              }
            ]

      - name: Register Package in ServiceNow
        uses: ServiceNow/servicenow-devops-register-package@v3.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_TOKEN }}
          instance-url: ${{ vars.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: build
          artifacts: |
            [
              {
                "name": "cadence-app",
                "version": "1.0.${{ github.run_number }}",
                "semanticVersion": "1.0.${{ github.run_number }}",
                "repositoryName": "${{ github.repository }}"
              }
            ]
          package-name: cadence-package-1.0.${{ github.run_number }}

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test Step
        run: echo "Running tests..."

  sonarqube:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=service-now-poc
            -Dsonar.organization=service-now-poc

